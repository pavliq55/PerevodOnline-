# Облачная сборка на Маке GitHub.
# 1) Всегда: сборка для симулятора + скриншоты экрана (без подписки Apple).
# 2) Когда в секретах есть ключ App Store Connect (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8) и
#    TESTFLIGHT=1 в переменных репозитория — подписанная сборка и отправка в TestFlight.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Проект
        run: brew install xcodegen && xcodegen generate
      - name: Сборка для симулятора
        run: |
          set -o pipefail
          xcodebuild -project Perevod.xcodeproj -scheme Perevod -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ci-build.log | grep -E "error:|warning: |BUILD" || true
          test -d build/Build/Products/Debug-iphonesimulator/Perevod.app
      - name: Запуск в симуляторе и скриншоты
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys; d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          c.sort(key=lambda x: ('Pro Max' not in x['name'], x['name'])); print(c[0]['udid'])")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Perevod.app
          xcrun simctl privacy "$UDID" grant microphone com.pavliq55.tapny || true
          xcrun simctl launch "$UDID" com.pavliq55.tapny
          mkdir -p shots; sleep 6; xcrun simctl io "$UDID" screenshot shots/0-consent.png
          # согласие «нажато» — дальше переводчик
          xcrun simctl terminate "$UDID" com.pavliq55.tapny || true
          xcrun simctl spawn "$UDID" defaults write com.pavliq55.tapny consent_v1 -bool YES
          xcrun simctl launch "$UDID" com.pavliq55.tapny
          sleep 12; xcrun simctl io "$UDID" screenshot shots/1-start.png
          xcrun simctl ui "$UDID" appearance dark; sleep 4; xcrun simctl io "$UDID" screenshot shots/2-dark.png
          # Иконка на экране «Домой»: тему ставим ДО установки (значок рисуется заново), плюс проверка, что
          # тёмный и тонированный варианты попали в сборку
          xcrun assetutil --info build/Build/Products/Debug-iphonesimulator/Perevod.app/Assets.car | grep -i -E '"Appearance"|"Name" : "AppIcon' | sort | uniq -c > shots/icon-variants.txt || true
          for th in dark light; do
            xcrun simctl uninstall "$UDID" com.pavliq55.tapny || true
            xcrun simctl ui "$UDID" appearance $th; sleep 3
            xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Perevod.app; sleep 6
            xcrun simctl io "$UDID" screenshot shots/home-$th.png
          done
          # Команды (Siri / кнопка действия): ссылки perevod://… не должны ронять приложение
          xcrun simctl spawn "$UDID" defaults write com.pavliq55.tapny consent_v1 -bool YES
          xcrun simctl launch "$UDID" com.pavliq55.tapny; sleep 8
          sleep 2
          xcrun simctl io "$UDID" screenshot shots/5-after-actions.png
          xcrun simctl terminate "$UDID" com.pavliq55.tapny || true
          xcrun simctl launch "$UDID" com.pavliq55.tapny -demoOffline YES; sleep 6; xcrun simctl io "$UDID" screenshot shots/6-offline.png
          # родной экран «Ауры»: настоящий Liquid Glass + 6 вариантов шрифтов Apple
          for g in 0 1 2; do
            xcrun simctl terminate "$UDID" com.pavliq55.tapny || true
            xcrun simctl launch "$UDID" com.pavliq55.tapny -auraPreview 2 -glassMode $g; sleep 5
            xcrun simctl io "$UDID" screenshot shots/glass-$g.png
          done
          # родной интерфейс: вход, главный экран, запись
          for v in login demoUI demoRec; do
            xcrun simctl terminate "$UDID" com.pavliq55.tapny || true
            if [ $v = login ]; then xcrun simctl launch "$UDID" com.pavliq55.tapny; else xcrun simctl launch "$UDID" com.pavliq55.tapny -$v YES; fi
            sleep 6; xcrun simctl io "$UDID" screenshot shots/native-$v.png
          done
          # прогон «как вживую» (-demoFlow YES): снимок в конце; видео (simctl io recordVideo) включать только для проверки — оно ~50 МБ
          xcrun simctl terminate "$UDID" com.pavliq55.tapny || true
          xcrun simctl launch "$UDID" com.pavliq55.tapny -demoFlow YES; sleep 9; xcrun simctl io "$UDID" screenshot shots/flow-live.png
          sleep 18; xcrun simctl io "$UDID" screenshot shots/flow-end.png
          # те же экраны в тёмном оформлении айфона
          xcrun simctl ui "$UDID" appearance dark; sleep 2
          for v in login demoUI demoRec; do
            xcrun simctl terminate "$UDID" com.pavliq55.tapny || true
            if [ $v = login ]; then xcrun simctl launch "$UDID" com.pavliq55.tapny; else xcrun simctl launch "$UDID" com.pavliq55.tapny -$v YES; fi
            sleep 6; xcrun simctl io "$UDID" screenshot shots/dark-$v.png
          done
          xcrun simctl terminate "$UDID" com.pavliq55.tapny || true
          xcrun simctl spawn "$UDID" defaults delete com.pavliq55.tapny consent_v1 || true
          xcrun simctl launch "$UDID" com.pavliq55.tapny; sleep 6; xcrun simctl io "$UDID" screenshot shots/dark-consent.png
          xcrun simctl ui "$UDID" appearance light
          # расширение «Поделиться» встроено в приложение
          ls build/Build/Products/Debug-iphonesimulator/Perevod.app/PlugIns/ > shots/plugins.txt 2>&1 || true
          xcrun simctl listapps "$UDID" | grep -A3 com.pavliq55.tapny | head -5 > shots/app-alive.txt || true
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "Perevod"' --style compact > shots/app.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator
          path: |
            shots/
            ci-build.log
          retention-days: 7

  # Файл приложения для айфона без платного аккаунта Apple: ставится через SideStore,
  # он сам подписывает его бесплатным Apple ID. Права (группа приложения) вшиваем «пустой» подписью,
  # чтобы SideStore их увидел и выдал такие же.
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Проект
        run: brew install xcodegen && xcodegen generate
      - name: Сборка для айфона (без подписи)
        run: |
          set -o pipefail
          xcodebuild -project Perevod.xcodeproj -scheme Perevod -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER build 2>&1 | tee ci-ipa.log | grep -E "error:|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Perevod.app
      - name: Упаковка в .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/Perevod.app
          codesign -f -s - --entitlements ShareExt/ShareExt.entitlements "$APP/PlugIns/ShareExt.appex"
          codesign -f -s - --entitlements Controls/Controls.entitlements "$APP/PlugIns/Controls.appex"
          codesign -f -s - --entitlements Perevod/Perevod.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>&1 | tail -12
          mkdir Payload && cp -R "$APP" Payload/ && zip -qry Tapny.ipa Payload && ls -la Tapny.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa
          path: |
            Tapny.ipa
            ci-ipa.log
          retention-days: 30
