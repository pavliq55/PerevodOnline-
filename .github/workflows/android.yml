# «Tapny Эфир» для Андроида: сборка без подписи (подписывает сервер — ключ в GitHub не хранится)
# и снимки экранов в эмуляторе. Запуск — отправкой в ветку android или вручную.
name: android
permissions:
  contents: read
on:
  push:
    branches: [android]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Сборка
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log | grep -E "^e: |error:|FAILURE|BUILD" || true
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Временная подпись для эмулятора
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore ci.jks -storepass android -keypass android -alias ci -keyalg RSA -dname CN=ci -validity 3 -noprompt
          $BT/apksigner sign --ks ci.jks --ks-pass pass:android --out ci.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Снимки экранов в эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ci-shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            build.log
            shots/
          retention-days: 14
