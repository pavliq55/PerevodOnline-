# Проект Xcode собирается из этого файла (XcodeGen) — на облачном Маке GitHub, без компьютера.
name: Perevod
options:
  bundleIdPrefix: com.pavliq55
  developmentLanguage: ru            # фразы Siri — по-русски
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Perevod:
    type: application
    platform: iOS
    sources: [Perevod]
    info:
      path: Perevod/Info.plist
      properties:
        CFBundleDisplayName: Перевод
        CFBundleDevelopmentRegion: ru
        CFBundleURLTypes:
          - CFBundleURLName: com.pavliq55.perevod
            CFBundleURLSchemes: [perevod]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы переводить твою речь и речь собеседника.
        NSCameraUsageDescription: Камера нужна, чтобы переводить меню, вывески и документы по фото.
        NSSpeechRecognitionUsageDescription: Распознавание речи на самом айфоне — чтобы переводить голосом даже без интернета.
        NSPhotoLibraryUsageDescription: Доступ к фото нужен, чтобы переводить текст на выбранных снимках.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pavliq55.perevod
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
