# Проект Xcode собирается из этого файла (XcodeGen) — на облачном Маке GitHub, без компьютера.
name: Perevod
options:
  bundleIdPrefix: com.pavliq55
  developmentLanguage: ru            # фразы Siri — по-русски
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Perevod:
    type: application
    platform: iOS
    sources: [Perevod, Common]
    dependencies:
      - target: ShareExt
      - target: Controls
    entitlements:
      path: Perevod/Perevod.entitlements
      properties:
        com.apple.security.application-groups: [group.com.pavliq55.tapny]
    info:
      path: Perevod/Info.plist
      properties:
        CFBundleDisplayName: Tapny
        INAlternativeAppNames:              # чтобы Siri понимала по-русски: «переведи в Тапни»
          - INAlternativeAppName: Тапни
            INAlternativeAppNamePronunciationHint: тапни
        CFBundleDevelopmentRegion: ru
        CFBundleURLTypes:
          - CFBundleURLName: com.pavliq55.tapny
            CFBundleURLSchemes: [tapny, perevod]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы переводить твою речь и речь собеседника.
        NSCameraUsageDescription: Камера нужна, чтобы переводить меню, вывески и документы по фото.
        NSSpeechRecognitionUsageDescription: Распознавание речи на самом айфоне — чтобы переводить голосом даже без интернета.
        NSPhotoLibraryUsageDescription: Доступ к фото нужен, чтобы переводить текст на выбранных снимках.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pavliq55.tapny
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
  ShareExt:
    type: app-extension
    platform: iOS
    sources: [ShareExt, Common]
    entitlements:
      path: ShareExt/ShareExt.entitlements
      properties:
        com.apple.security.application-groups: [group.com.pavliq55.tapny]
    info:
      path: ShareExt/Info.plist
      properties:
        CFBundleDisplayName: Tapny
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pavliq55.tapny.share
        CODE_SIGN_STYLE: Automatic
  Controls:
    type: app-extension
    platform: iOS
    sources: [Controls, Common]
    entitlements:
      path: Controls/Controls.entitlements
      properties:
        com.apple.security.application-groups: [group.com.pavliq55.tapny]
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: Tapny
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pavliq55.tapny.controls
        CODE_SIGN_STYLE: Automatic
